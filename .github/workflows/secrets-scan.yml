name: Secrets Scan

# Runs on every push and pull request to main.
# Blocks credential findings, with exact historical false-positive exceptions
# checked by .github/scripts/check-secret-scan.py.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    name: TruffleHog — Secret Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history lets truffleHog scan all commits, not just the tip.
          fetch-depth: 0

      - name: Test secret-scan policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Run TruffleHog OSS
        shell: bash
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(git file:///repo --branch "$SCAN_HEAD" --fail --no-update --json)
          if [[ -n "$SCAN_BASE" && "$SCAN_BASE" != "0000000000000000000000000000000000000000" ]]; then
            args+=(--since-commit "$SCAN_BASE")
          fi
          # Keep verified, unverified, and unknown results. Do not exclude files
          # or disable the URI detector to hide a historical dummy credential.
          status=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/trufflesecurity/trufflehog:3.99.2 "${args[@]}" \
            > "$RUNNER_TEMP/trufflehog.jsonl" || status=$?
          python3 .github/scripts/check-secret-scan.py "$RUNNER_TEMP/trufflehog.jsonl" "$status"
