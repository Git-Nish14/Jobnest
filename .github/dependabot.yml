# Dependabot keeps npm packages and GitHub Actions up to date automatically.
# Weekly PRs on Mondays; one PR per dependency so broken builds are easy to isolate.

version: 2

updates:
  # ── npm (web/) ─────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    # No groups — each dependency gets its own PR.
    open-pull-requests-limit: 20
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    # No groups — each action gets its own PR.
    open-pull-requests-limit: 20
    labels:
      - dependencies
      - github-actions
      - automated
    commit-message:
      prefix: "chore(ci)"
